name: smoke-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    # Pinned: tests/golden.json was made on this image. ubuntu-latest moves to 26.04 between 2026-10-19 and 2026-11-19,
    # which could change the font-measuring results. To move on, switch the label and replace tests/golden.json from the new run's artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Environment
        run: |
          grep PRETTY_NAME /etc/os-release
          python3 --version
          google-chrome --version
      - name: Smoke / regression test
        run: python3 tests/run.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: tests/out/
          if-no-files-found: ignore
